<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Web Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">TikTok<span>Clone</span></div>
            <div class="side-nav">
                <div class="nav-item active" onclick="showScreen('feed')"><i class="fas fa-home"></i> Для вас</div>
                <div class="nav-item" onclick="showScreen('profile')"><i class="fas fa-user"></i> Профиль</div>
            </div>
        </aside>

        <main class="main-content">
            <section id="s-feed" class="screen active"></section>

            <section id="s-profile" class="screen">
                <div class="profile-header">
                    <div class="avatar-wrap" onclick="document.getElementById('pfp-input').click()">
                        <img id="my-pfp" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky">
                    </div>
                    <h2 id="my-name" contenteditable="true" onblur="saveProfile()">@user_name</h2>
                    <div class="p-stats">
                        <span><b id="c-vids">0</b> видео</span>
                        <span><b id="c-likes">0</b> лайков</span>
                    </div>
                </div>
                <div class="tabs">
                    <div class="tab active" onclick="switchGrid('my', this)">Видео</div>
                    <div class="tab" onclick="switchGrid('liked', this)">Лайки</div>
                </div>
                <div id="g-my" class="video-grid active-grid"></div>
                <div id="g-liked" class="video-grid"></div>
            </section>
        </main>

        <nav class="mobile-nav">
            <div onclick="showScreen('feed')"><i class="fas fa-home"></i></div>
            <label for="vid-input" class="upload-btn">+</label>
            <div onclick="showScreen('profile')"><i class="fas fa-user"></i></div>
        </nav>

        <div id="video-viewer" class="viewer-modal">
            <div class="viewer-body">
                <div class="close-btn" onclick="closeViewer()">×</div>
                <div class="viewer-player">
                    <video id="viewer-video" loop playsinline></video>
                </div>
                <div class="viewer-side">
                    <div class="author-info">
                        <b id="viewer-author">@author</b>
                        <p id="viewer-desc">Описание видео...</p>
                    </div>
                    <div id="comment-list" class="comments-box"></div>
                    <div class="input-box">
                        <input type="text" id="comm-text" placeholder="Оставьте комментарий...">
                        <button onclick="addComment()"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <input type="file" id="vid-input" accept="video/*" hidden onchange="handleUpload(event)">
        <input type="file" id="pfp-input" accept="image/*" hidden onchange="handlePfp(event)">
    </div>
    <script src="script.js"></script>
</body>
</html>
