<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Web HTML</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        
        <div id="feed-screen" class="screen active-screen">
            </div>

        <div id="profile-screen" class="screen">
            <div class="profile-header">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="avatar">
                <h2 id="username">@user_web</h2>
                <p>20 Видео | <span id="like-counter">0</span> Лайков</p>
            </div>
            
            <div class="profile-tabs">
                <button onclick="showGrid('all')" class="active-tab">Мои Видео</button>
                <button onclick="showGrid('likes')">Лайки</button>
            </div>

            <div id="grid-all" class="video-grid active-grid"></div>
            <div id="grid-likes" class="video-grid"></div>
        </div>

    </div>

    <nav class="bottom-bar">
        <button onclick="switchScreen('feed')"><i class="fas fa-home"></i></button>
        
        <div class="add-button-wrapper">
            <label for="upload-input" class="add-button">+</label>
        </div>
        
        <button onclick="switchScreen('profile')"><i class="fas fa-user"></i></button>
    </nav>

    <input type="file" id="upload-input" accept="video/*" hidden onchange="handleUpload(event)">

    <script src="script.js"></script>
</body>
</html>
