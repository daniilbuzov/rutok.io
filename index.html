<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok HTML Interface</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="mobile-frame">
        
        <section id="feed-section" class="app-screen active">
            </section>

        <section id="profile-section" class="app-screen">
            <header class="profile-header">
                <div class="avatar-container">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky" alt="Avatar">
                </div>
                <h2 class="username">@html_master</h2>
                <div class="profile-stats">
                    <div class="stat"><b>20</b><span>Видео</span></div>
                    <div class="stat"><b id="like-total">0</b><span>Лайков</span></div>
                </div>
            </header>

            <div class="profile-nav-tabs">
                <div class="p-tab active" onclick="setGrid('all')"><i class="fas fa-th"></i></div>
                <div class="p-tab" onclick="setGrid('likes')"><i class="fas fa-heart"></i></div>
            </div>

            <div id="grid-all" class="video-grid active-grid"></div>
            <div id="grid-likes" class="video-grid"></div>
        </section>

        <nav class="main-nav">
            <div class="nav-item" onclick="showScreen('feed')">
                <i class="fas fa-home"></i>
                <span>Главная</span>
            </div>
            
            <label for="video-input" class="upload-btn">
                <div class="plus-icon">+</div>
            </label>
            
            <div class="nav-item" onclick="showScreen('profile')">
                <i class="fas fa-user"></i>
                <span>Профиль</span>
            </div>
        </nav>

        <input type="file" id="video-input" accept="video/*" hidden onchange="handleNewVideo(event)">
    </div>

    <script src="script.js"></script>
</body>
</html>
