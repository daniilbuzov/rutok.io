<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Pro Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <main id="feed" class="screen active"></main>

        <main id="profile" class="screen">
            <div class="profile-header">
                <div class="avatar-box"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=8"></div>
                <h2 id="userName">@user_pro</h2>
                <div class="stats">
                    <div><b>20</b> Видео</div>
                    <div><b id="likeCount">0</b> Лайков</div>
                </div>
            </div>

            <div class="profile-tabs">
                <div class="tab-btn active" onclick="switchProfileTab('my-vids', this)"><i class="fas fa-th"></i></div>
                <div class="tab-btn" onclick="switchProfileTab('liked-vids', this)"><i class="fas fa-heart"></i></div>
            </div>

            <div id="my-vids" class="grid-content active"></div>
            <div id="liked-vids" class="grid-content"></div>
        </main>

        <nav class="footer-nav">
            <div onclick="changeTab('feed')"><i class="fas fa-home"></i></div>
            <label for="fileInp" class="plus-box">+</label>
            <div onclick="changeTab('profile')"><i class="fas fa-user"></i></div>
        </nav>

        <input type="file" id="fileInp" accept="video/*" hidden onchange="uploadVideo(event)">
    </div>
    <script src="script.js"></script>
</body>
</html>
