<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Classic Stable</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="app-wrapper">
        <main id="s-feed" class="screen active"></main>

        <section id="s-profile" class="screen">
            <div class="profile-meta">
                <div class="user-avatar"></div>
                <h2>@my_account</h2>
                <div class="stats"><b>0</b> Подписчиков · <b id="p-count">0</b> Видео</div>
            </div>
            <div class="video-grid" id="p-grid"></div>
        </section>

        <nav class="main-nav">
            <div class="nav-btn" onclick="goTo('feed')"><i class="fas fa-home"></i></div>
            <div class="nav-btn upload" onclick="document.getElementById('file-in').click()">+</div>
            <div class="nav-btn" onclick="goTo('profile')"><i class="fas fa-user"></i></div>
        </nav>
    </div>

    <input type="file" id="file-in" accept="video/*" hidden onchange="handleNewVideo(event)">

    <script src="script.js"></script>
</body>
</html>
