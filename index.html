<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Full Fix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <main id="feed" class="screen active"></main>

        <main id="profile" class="screen">
            <div class="profile-header">
                <div class="avatar-edit" onclick="document.getElementById('pfpInp').click()">
                    <img id="userPfp" src="https://api.dicebear.com/7.x/pixel-art/svg?seed=1">
                    <div class="edit-icon"><i class="fas fa-camera"></i></div>
                </div>
                <h2 id="userName" contenteditable="true" onblur="saveProfile()">@твой_ник</h2>
                <p id="userBio" contenteditable="true" onblur="saveProfile()">Нажми, чтобы изменить био...</p>
                <div class="stats">
                    <div><b>0</b> Подписки</div>
                    <div><b>0</b> Лайки</div>
                </div>
            </div>
            <div class="profile-grid" id="profileGrid"></div>
        </main>

        <div id="uploadModal" class="modal">
            <div class="modal-content">
                <h3>Публикация</h3>
                <video id="previewVid" muted autoplay loop></video>
                <input type="text" id="descInp" placeholder="Добавь описание к видео...">
                <div class="modal-btns">
                    <button class="btn-cancel" onclick="closeModal()">Отмена</button>
                    <button class="btn-confirm" onclick="confirmUpload()">Опубликовать</button>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item" onclick="showTab('feed')"><i class="fas fa-home"></i></div>
            <label for="fileInp" class="plus-btn"><i class="fas fa-plus"></i></label>
            <div class="nav-item" onclick="showTab('profile')"><i class="fas fa-user"></i></div>
        </nav>

        <input type="file" id="fileInp" accept="video/*" hidden onchange="openEditor(event)">
        <input type="file" id="pfpInp" accept="image/*" hidden onchange="updateAvatar(event)">
    </div>
    <script src="script.js"></script>
</body>
</html>
