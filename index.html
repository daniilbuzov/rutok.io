<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Fix Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <section id="s-feed" class="screen active"></section>

        <section id="s-profile" class="screen">
            <div class="p-header">
                <div class="p-avatar" onclick="document.getElementById('inp-pfp').click()">
                    <img id="view-pfp" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Base">
                    <div class="p-edit-icon"><i class="fas fa-camera"></i></div>
                </div>
                <h2 id="view-name" contenteditable="true" onblur="saveUser()">@web_hero</h2>
                <div class="p-stats">
                    <span><b id="count-vids">0</b> видео</span>
                    <span><b id="count-likes">0</b> лайков</span>
                </div>
            </div>

            <div class="p-tabs">
                <div class="p-tab active" onclick="setGrid('all', this)"><i class="fas fa-th"></i></div>
                <div class="p-tab" onclick="setGrid('liked', this)"><i class="fas fa-heart"></i></div>
            </div>

            <div id="g-all" class="grid active"></div>
            <div id="g-liked" class="grid"></div>
        </section>

        <nav class="navbar">
            <div onclick="show('feed')"><i class="fas fa-home"></i></div>
            <label for="inp-vid" class="upload-btn">+</label>
            <div onclick="show('profile')"><i class="fas fa-user"></i></div>
        </nav>

        <input type="file" id="inp-vid" accept="video/*" hidden onchange="preUpload(event)">
        <input type="file" id="inp-pfp" accept="image/*" hidden onchange="updatePfp(event)">

        <div id="modal-desc" class="modal">
            <div class="modal-box">
                <h3>Публикация</h3>
                <input type="text" id="inp-desc" placeholder="О чем это видео?">
                <button onclick="finishUpload()">Загрузить</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
