<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Classic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <main id="s-feed" class="screen active"></main>

        <section id="s-profile" class="screen">
            <div class="p-header">
                <div class="avatar"></div>
                <h2>@my_profile</h2>
                <div class="stats"><b>0</b> подписок · <b id="p-v-count">0</b> видео</div>
            </div>
            <div class="p-grid" id="p-grid"></div>
        </section>

        <nav class="nav">
            <div onclick="show('feed')"><i class="fas fa-home"></i></div>
            <div class="plus" onclick="document.getElementById('f-in').click()">+</div>
            <div onclick="show('profile')"><i class="fas fa-user"></i></div>
        </nav>
    </div>

    <input type="file" id="f-in" accept="video/*" hidden onchange="upload(event)">
    <script src="script.js"></script>
</body>
</html>
