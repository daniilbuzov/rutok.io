<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Web Pro Fix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div id="screen-feed" class="app-screen active"></div>

        <div id="screen-profile" class="app-screen">
            <div class="user-info">
                <div class="pfp-circle" onclick="document.getElementById('pfp-inp').click()">
                    <img id="user-pfp" src="https://api.dicebear.com/7.x/avataaars/svg?seed=7">
                    <div class="pfp-overlay"><i class="fas fa-camera"></i></div>
                </div>
                <h2 id="user-name" contenteditable="true" onblur="updateUserData()">@creative_mind</h2>
                <div class="user-stats">
                    <span><b id="vid-count">0</b> видео</span>
                    <span><b id="like-count">0</b> лайков</span>
                </div>
            </div>

            <div class="profile-tabs">
                <button class="tab-btn active" onclick="changeGrid('mine', this)"><i class="fas fa-th"></i></button>
                <button class="tab-btn" onclick="changeGrid('liked', this)"><i class="fas fa-heart"></i></button>
            </div>

            <div id="grid-mine" class="grid-display active-grid"></div>
            <div id="grid-liked" class="grid-display"></div>
        </div>

        <nav class="nav-menu">
            <div class="nav-link" onclick="navigate('feed')"><i class="fas fa-home"></i></div>
            <div class="upload-center">
                <label for="vid-inp" class="plus-link">+</label>
            </div>
            <div class="nav-link" onclick="navigate('profile')"><i class="fas fa-user"></i></div>
        </nav>

        <input type="file" id="vid-inp" accept="video/*" hidden onchange="startUpload(event)">
        <input type="file" id="pfp-inp" accept="image/*" hidden onchange="changeAvatar(event)">

        <div id="upload-modal" class="custom-modal">
            <div class="modal-body">
                <h3>Публикация</h3>
                <input type="text" id="desc-inp" placeholder="Добавьте подпись...">
                <button onclick="saveVideoData()">Опубликовать</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
