<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Final</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <main id="feed" class="screen active"></main>

        <main id="profile" class="screen">
            <div class="profile-header">
                <div class="avatar"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix"></div>
                <h2 id="username">@pro_user</h2>
                <div class="stats">
                    <span><b>20</b> Видео</span>
                    <span><b id="totalLikes">0</b> Лайки</span>
                </div>
            </div>

            <div class="tabs">
                <div id="tab-all" class="tab-item active" onclick="switchTab('all')"><i class="fas fa-th"></i></div>
                <div id="tab-likes" class="tab-item" onclick="switchTab('likes')"><i class="fas fa-heart"></i></div>
            </div>

            <div id="grid-all" class="video-grid active-grid"></div>
            <div id="grid-likes" class="video-grid"></div>
        </main>

        <nav class="nav-bar">
            <div onclick="openScreen('feed')"><i class="fas fa-home"></i></div>
            <label class="plus-btn" for="fileInp">+</label>
            <div onclick="openScreen('profile')"><i class="fas fa-user"></i></div>
        </nav>

        <input type="file" id="fileInp" accept="video/*" hidden onchange="uploadVideo(event)">
    </div>
    <script src="script.js"></script>
</body>
</html>
