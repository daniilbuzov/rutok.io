<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Clone Fix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <div id="feed" class="screen active"></div>

        <nav class="bottom-nav">
            <div onclick="location.reload()"><i class="fas fa-home"></i></div>
            <div class="upload-btn" onclick="document.getElementById('fileInp').click()">+</div>
            <div onclick="alert('Профиль скоро будет!')"><i class="fas fa-user"></i></div>
        </nav>

        <input type="file" id="fileInp" accept="video/*" hidden onchange="uploadVideo(event)">
    </div>
    <script src="script.js"></script>
</body>
</html>
