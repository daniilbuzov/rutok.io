<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok Ultra Fix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">TikTok<span>Clone</span></div>
            <div class="nav-links">
                <div class="link active" onclick="showScreen('feed')"><i class="fas fa-home"></i> Рекомендуем</div>
                <div class="link" onclick="showScreen('profile')"><i class="fas fa-user"></i> Профиль</div>
            </div>
            <button class="add-btn-pc" onclick="document.getElementById('f-vid').click()">+ Загрузить</button>
        </aside>

        <main class="viewport">
            <section id="s-feed" class="screen active"></section>

            <section id="s-profile" class="screen">
                <div class="profile-top">
                    <img id="p-pfp" src="https://api.dicebear.com/7.x/avataaars/svg?seed=me">
                    <h2 id="p-username">@me</h2>
                    <div class="p-stats">
                        <span><b id="p-v-count">0</b> видео</span>
                        <span><b id="p-l-count">0</b> лайков</span>
                    </div>
                </div>
                <div class="p-grid" id="p-grid"></div>
            </section>
        </main>

        <aside class="comments-sidebar" id="comm-side">
            <div class="comm-header">Комментарии <span onclick="closeComments()">×</span></div>
            <div id="comm-list"></div>
            <div class="comm-input">
                <input type="text" id="comm-msg" placeholder="Написать...">
                <button onclick="sendComment()">📤</button>
            </div>
        </aside>

        <nav class="mobile-nav">
            <div onclick="showScreen('feed')"><i class="fas fa-home"></i></div>
            <div class="plus-circle" onclick="handlePlus()">+</div>
            <div onclick="showScreen('profile')"><i class="fas fa-user"></i></div>
        </nav>
    </div>

    <input type="file" id="f-vid" hidden onchange="uploadFile(event)">
    <script src="script.js"></script>
</body>
</html>
